# 原生 fuzz 每日短跑:帧解析/首行解析/信令 JSON/注册中心端点是网络暴露面,
# 单测只覆盖已知形态,fuzz 负责未知的解析失控(panic/5xx)。种子在 *_fuzz_test.go。
name: Fuzz
on:
  schedule:
    - cron: "23 19 * * *" # 每日 03:23 UTC,避整点 runner 高峰
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Fuzz(每目标 1-1.5 分钟短跑)
        run: |
          set -e
          go test -run xxx -fuzz '^FuzzReadMsg$'             -fuzztime 60s ./internal/wire/
          go test -run xxx -fuzz '^FuzzWriteReadRoundTrip$'  -fuzztime 60s ./internal/wire/
          go test -run xxx -fuzz '^FuzzReadLine$'            -fuzztime 60s ./internal/relay/
          go test -run xxx -fuzz '^FuzzClientFrame$'         -fuzztime 60s ./internal/signaling/
          go test -run xxx -fuzz '^FuzzRegisterHandler$'     -fuzztime 90s ./internal/server/
          go test -run xxx -fuzz '^FuzzAnnounceHandler$'     -fuzztime 60s ./internal/server/
