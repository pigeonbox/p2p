name: Release
# 打 v* tag → ① 多架构镜像推 ghcr.io/pigeonbox/p2p(amd64+arm64);
# ② p2pc 直传客户端六平台二进制挂本仓 Release 并回挂 hub(桌面端 sidecar/终端用户分发)。
# 注意:新镜像包默认 private,首个 release 后需在 GitHub Packages 页手动 flip public
# (fnos 踩过的坑)。provenance=false:buildx 默认认证清单会使 GitHub Packages 页
# 渲染 500(拉取不受影响,仅 Web UI 坏)。
#
# ── 已发 tag 的回挂自愈（p2p#59）────────────────────────────────────────
# 曾出现 hub 上的 p2p-v* Release 被仓外动作删除、而本工作流只能由 tag push
# 触发 ⇒ 已发 tag 无法重跑，发布列车卡在「hub Release 资产未就绪」。
# 现在支持手动 dispatch 指定现有 tag（不会重切 tag）：
#   gh workflow run release.yml -R pigeonbox/p2p -f version=v0.9.7
# 该次运行会重建镜像 tag、重挂本仓 Release、重建/补齐 hub 回挂资产，
# 并回调 hub 列车（train-advance），无需人工补 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标 tag（现有 tag 名，必须带 v 前缀，如 v0.9.7）。重跑发布+hub 回挂'
        required: true
        type: string

concurrency:
  # 同 tag 的重跑可能与列车触发的运行并发:两边都 gh release create/upload 写
  # 同一 Release,先写者被静默覆盖。按目标版本分组串行;cancel-in-progress:false
  # ——发布中途取消比排队更糟。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;推 ghcr / 建 Release 的作业在作业级单独开 contents/packages: write
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/pigeonbox/p2p

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # dispatch 的 github.ref 是分支；必须按输入的目标 tag 检出并打标签。
      REL_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REL_TAG }}
      - name: 解析目标版本（dispatch 输入校验）
        id: ver
        run: |
          case "$REL_TAG" in
            v*) ;;
            *) echo "::error::version 必须是现有 tag（带 v 前缀），如 v0.9.7；收到: $REL_TAG"; exit 1 ;;
          esac
          V="${REL_TAG#v}"
          {
            echo "version=$V"
            echo "major_minor=${V%.*}"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "目标版本 $REL_TAG（commit $(git rev-parse --short HEAD)）"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            # dispatch 时 ref 是分支，semver 规则不生效 ⇒ 显式补同名 tag，
            # 保证重跑产出与 tag 触发的镜像标签一致。
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            VERSION=${{ env.REL_TAG }}
            COMMIT=${{ steps.ver.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct

  # p2pc / p2pc-web 设备直传客户端六平台二进制: 挂本仓 Release(终端用户/桌面端
  # sidecar 的分发渠道——p2pc 在用户设备上跑,镜像里的二进制够不着他们)。
  # 命名 = Tauri target triple(desktop 仓 CI 按 triple 拉取做 sidecar);
  # p2pc-web = 网页模式客户端(老底座桌面: 内置本地 Web UI + 直传,纯静态无
  # webkit 依赖),资产名同以 p2pc- 开头,复用下方上传/回挂/checksums 通配。
  p2pc-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      REL_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REL_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: 交叉编译 p2pc / p2pc-web(纯静态 CGO=0)
        run: |
          VERSION="${REL_TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-w -s -X 'github.com/oekit/core/version.Version=${VERSION}' -X 'github.com/oekit/core/version.BuildCommit=${COMMIT}' -X 'github.com/oekit/core/version.BuildTime=${BUILD_TIME}'"
          mkdir -p out
          build() { GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "out/$3" ./cmd/"$4"; }
          build linux   amd64 p2pc-x86_64-unknown-linux-gnu        p2pc
          build linux   arm64 p2pc-aarch64-unknown-linux-gnu       p2pc
          build darwin  amd64 p2pc-x86_64-apple-darwin             p2pc
          build darwin  arm64 p2pc-aarch64-apple-darwin            p2pc
          build windows amd64 p2pc-x86_64-pc-windows-msvc.exe      p2pc
          build windows arm64 p2pc-aarch64-pc-windows-msvc.exe     p2pc
          build linux   amd64 p2pc-web-x86_64-unknown-linux-gnu    p2pcweb
          build linux   arm64 p2pc-web-aarch64-unknown-linux-gnu   p2pcweb
          build darwin  amd64 p2pc-web-x86_64-apple-darwin         p2pcweb
          build darwin  arm64 p2pc-web-aarch64-apple-darwin        p2pcweb
          build windows amd64 p2pc-web-x86_64-pc-windows-msvc.exe  p2pcweb
          build windows arm64 p2pc-web-aarch64-pc-windows-msvc.exe p2pcweb
          (cd out && shasum -a 256 p2pc-* > p2pc-checksums.txt)
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.REL_TAG }}
        run: |
          gh release upload "$TAG" out/p2pc-* --repo "$GITHUB_REPOSITORY" --clobber || {
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "p2p $TAG" \
              --notes "PigeonBeam(信鸽直传):设备直传客户端 p2pc / p2pc-web 网页模式 + 联邦注册中心 p2pd。镜像见 ghcr.io/pigeonbox/p2p;产品定位见 docs/PRODUCT.md" \
              && gh release upload "$TAG" out/p2pc-* --repo "$GITHUB_REPOSITORY";
          }

  # p2pc 二进制回挂生态主仓(产物统一出口)。跨仓写需 P2P_PAT——与 desktop/fnos 同一约定。
  # 断链必须响(2026-10-08 拔除 continue-on-error:P2P_PAT 失效时 v0.4.4 曾疑似被静默吞掉回挂)。
  attach-to-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: p2pc-binaries
    env:
      REL_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: 回挂 p2pc 二进制到 hub
        env:
          GH_TOKEN: ${{ secrets.P2P_PAT }}
          TAG: ${{ env.REL_TAG }}
        run: |
          sleep 10
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/p2p](https://github.com/pigeonbox/p2p) · **完整变更日志**: [%s](https://github.com/pigeonbox/p2p/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "P2P 联邦:注册中心镜像(ghcr.io/pigeonbox/p2p)与设备直传客户端 p2pc / p2pc-web 网页模式(见 Assets,文件名含目标平台 triple)。" "${TAG}" "${TAG}")
          gh release view "p2p-$TAG" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "p2p-$TAG" --repo pigeonbox/pigeonbox \
              --title "PigeonBox P2P $TAG" \
              --latest=false \
              --notes "${NOTES}"
          mkdir -p /tmp/p2pc
          ok=0
          for _ in 1 2 3 4 5 6; do
            if gh release download "$TAG" --repo pigeonbox/p2p --dir /tmp/p2pc --clobber; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::拉取本仓 Release 二进制失败"; exit 1; }
          shopt -s nullglob
          for f in /tmp/p2pc/p2pc-*; do
            gh release upload "p2p-$TAG" "$f" --repo pigeonbox/pigeonbox --clobber
          done
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "p2p-$TAG" --repo pigeonbox/pigeonbox --latest=false || true
          # 回挂完整性校验（p2p#59）：hub 侧被外部删除/半删后重跑，必须补齐
          # 与本仓 Release 同集的 p2pc-* 资产，而不是"命令返回 0 就算好"。
          expected=$(find /tmp/p2pc -maxdepth 1 -name 'p2pc-*' -type f | wc -l | tr -d ' ')
          got=$(gh release view "p2p-$TAG" --repo pigeonbox/pigeonbox --json assets \
            --jq '[.assets[] | select(.name | startswith("p2pc-"))] | length')
          [ "$got" -eq "$expected" ] || { echo "::error::hub 回挂资产数 $got ≠ 本仓 $expected"; exit 1; }
          echo "已回挂到 pigeonbox/pigeonbox Releases（$got 个 p2pc-* 资产）"

      # 回挂就位后回调 hub 列车编排器（p2p#59）：挂载恢复即刻唤醒 advance
      # 核对完成度；回调丢失由 hub 定期 sweep 兜底，不阻断发布本身。
      - name: 回调 hub 列车编排器（train-advance）
        env:
          CB_TOKEN: ${{ secrets.P2P_PAT }}
          TAG: ${{ env.REL_TAG }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"p2p\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
