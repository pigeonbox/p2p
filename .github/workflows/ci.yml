name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      # gofmt 门禁（2026-10-22 补）：此前 core/server/p2p/contracts 四个 Go 仓的
      # CI 都没有 gofmt 步，.golangci.yml 也没开 gofmt linter —— 格式漂移无人拦
      # （core 仓 HEAD 上就压着 19 个漂移文件）。**发现即红，修法是 gofmt -w**，
      # 不设豁免：豁免即免死金牌（与前端 api-body-types-check 门禁同族教训）。
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # lint 棘轮（.golangci.yml 从 0 issues 起步，只收紧不放宽）
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.14
          args: --timeout 9m
      # kit(pigeonbox/kit) 是有意放行的地基层(本身零生态依赖,p2p→kit 单向无环);
      # 禁的是业务链兄弟模块,勿把 kit 加进黑名单
      - name: Dep guard(p2p 禁依赖业务链兄弟模块;kit 地基层放行)
        run: |
          BAD=$(go list -deps ./... | grep -E '^github\.com/pigeonbox/(contracts|core|server|frontend|fnos|desktop|charts)' || true)
          if [ -n "$BAD" ]; then echo "✗ p2p 违规依赖:"; echo "$BAD"; exit 1; fi
          echo "✓ 依赖方向合规"
